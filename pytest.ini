[pytest]
testpaths = tests
pythonpath = .
markers =
    integration: tests contre une vraie base MongoDB de test (INTEGRATION_DATABASE_URL)
    e2e: parcours de bout en bout contre l'API dans son image Docker (E2E_BASE_URL)
addopts = --cov=app --cov-report=term-missing:skip-covered
filterwarnings =
    error::jwt.warnings.InsecureKeyLengthWarning
